<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMETER 26' — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --canopy:#173D2E; --canopy-dim:#0F2A20; --moss:#2D6A4F; --fern:#52796F; --fern-soft:#7C9A8E;
    --paper:#F1F3EA; --paper-dim:#E7EBDF; --gold:#D9A441; --bark:#3A2E1F; --alert:#B3402E;
    --line:#DFE5D6; --card:#FFFFFF;
    --shadow-sm:0 2px 8px rgba(23,61,46,.06);
    --shadow-md:0 10px 30px rgba(23,61,46,.10);
    --shadow-lg:0 20px 60px rgba(15,42,32,.18);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  ::selection{background:var(--gold);color:var(--canopy-dim);}
  body{
    margin:0;font-family:'Work Sans',Arial,sans-serif;color:var(--bark);
    background:
      radial-gradient(1100px 500px at 100% -10%, rgba(217,164,65,.14), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(45,106,79,.12), transparent 55%),
      var(--paper);
    min-height:100vh;
  }
  h1,h2{font-family:'Fraunces',Georgia,serif;color:var(--canopy);letter-spacing:-.01em;}
  .hidden{display:none !important;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#C9D2BE;border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------------- login ---------------- */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;
  }
  #loginScreen::before{
    content:"";position:absolute;inset:0;z-index:0;
    background:
      radial-gradient(700px 380px at 15% 20%, rgba(45,106,79,.20), transparent 60%),
      radial-gradient(600px 400px at 85% 85%, rgba(217,164,65,.18), transparent 60%),
      linear-gradient(160deg, var(--canopy) 0%, var(--canopy-dim) 100%);
  }
  .login-mark{
    position:relative;z-index:1;margin-bottom:18px;display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .login-mark svg{filter:drop-shadow(0 6px 14px rgba(0,0,0,.25));}
  .login-mark .tag{color:rgba(241,243,234,.72);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;}
  .login-card{
    position:relative;z-index:1;
    background:var(--card);padding:38px 34px 32px;border-radius:20px;box-shadow:var(--shadow-lg);
    width:100%;max-width:380px;border:1px solid rgba(255,255,255,.6);
  }
  .login-card h1{margin:0 0 2px;font-size:26px;}
  .login-card .sub{color:var(--fern);margin:0 0 22px;font-size:13.5px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--fern);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  .login-card input{
    width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;
    font-family:inherit;background:#FAFBF6;transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .login-card input:focus{
    outline:none;border-color:var(--moss);background:#fff;box-shadow:0 0 0 4px rgba(45,106,79,.12);
  }
  .login-card button{
    width:100%;padding:13px;background:var(--canopy);color:#fff;border:none;border-radius:10px;
    font-weight:600;font-size:14px;margin-top:6px;cursor:pointer;transition:background .15s, transform .1s;
  }
  .login-card button:hover{background:var(--canopy-dim);}
  .login-card button:active{transform:translateY(1px);}
  #loginError{color:var(--alert);font-size:13px;margin-top:10px;min-height:1px;}

  /* ---------------- dashboard ---------------- */
  #dash{display:none;padding:28px 28px 60px;max-width:1240px;margin:0 auto;}
  .header{
    display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;flex-wrap:wrap;gap:14px;
    padding-bottom:18px;border-bottom:1px solid var(--line);
  }
  .header .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
  .header h1{margin:0;font-size:30px;}
  .header .sub{margin:4px 0 0;color:var(--fern);font-size:13.5px;}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px;}
  .stat{
    background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);
    border:1px solid var(--line);position:relative;overflow:hidden;transition:box-shadow .18s, transform .18s;
  }
  .stat:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .stat::after{
    content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;
    background:radial-gradient(circle, rgba(45,106,79,.10), transparent 70%);
  }
  .stat .num{font-family:'Fraunces',Georgia,serif;font-size:30px;color:var(--canopy);line-height:1;}
  .stat .label{margin-top:6px;font-size:11.5px;color:var(--fern);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .toolbar input, .toolbar select{
    padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px;
    font-family:inherit;background:var(--card);transition:border-color .15s, box-shadow .15s;
  }
  .toolbar input{min-width:220px;flex:1 1 220px;}
  .toolbar input:focus, .toolbar select:focus{outline:none;border-color:var(--moss);box-shadow:0 0 0 4px rgba(45,106,79,.10);}
  .btn{
    padding:10px 18px;border-radius:10px;border:none;background:var(--moss);color:#fff;font-weight:600;font-size:13.5px;
    cursor:pointer;font-family:inherit;transition:background .15s, transform .1s, box-shadow .15s;box-shadow:var(--shadow-sm);
  }
  .btn:hover{background:var(--canopy);}
  .btn:active{transform:translateY(1px);}
  .btn.outline{background:transparent;border:1.5px solid var(--line);color:var(--fern);box-shadow:none;}
  .btn.outline:hover{border-color:var(--moss);color:var(--moss);background:rgba(45,106,79,.06);}
  .btn.alert{background:var(--alert);}
  .btn.alert:hover{background:#8E3123;}

  .table-wrap{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--line);overflow:hidden;
  }
  table{width:100%;border-collapse:collapse;}
  th,td{padding:13px 16px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line);}
  th{
    background:var(--paper-dim);color:var(--fern);font-weight:700;text-transform:uppercase;font-size:10.5px;
    letter-spacing:.06em;position:sticky;top:0;
  }
  tbody tr{cursor:pointer;transition:background .12s;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#F6F8F1;}
  tbody tr:hover td:first-child{color:var(--canopy);font-weight:600;}
  .empty-row td{padding:40px 16px;text-align:center;color:var(--fern-soft);font-size:13.5px;}

  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.02em;}
  .badge.ok{background:#E3F1E8;color:var(--moss);}
  .badge.warn{background:#FBE9E2;color:var(--alert);}
  .badge.mid{background:#FCF3DC;color:#946B18;}

  /* ---------------- modal ---------------- */
  #modalBg{
    position:fixed;inset:0;background:rgba(15,42,32,.55);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  #modal{
    background:var(--card);border-radius:18px;max-width:760px;width:100%;max-height:88vh;overflow:auto;
    padding:30px 32px;box-shadow:var(--shadow-lg);
  }
  #modal h2{margin-top:0;font-size:22px;}
  .qa-row{padding:13px 0;border-bottom:1px solid var(--line);}
  .qa-row:last-child{border-bottom:none;}
  .qa-row .qtxt{font-weight:600;font-size:14px;margin-bottom:6px;}
  .qa-row .ans{font-size:13px;}
  .ans.correct{color:var(--moss);font-weight:700;}
  .ans.wrong{color:var(--alert);font-weight:700;}
  .ans.unanswered{color:#999;font-style:italic;}
  .viol-item{font-size:12px;background:#FBE9E2;color:var(--alert);border-radius:8px;padding:7px 11px;margin-bottom:6px;}
  #modalClose{
    float:right;background:var(--paper-dim);border:none;width:30px;height:30px;border-radius:50%;
    font-size:15px;cursor:pointer;color:var(--fern);transition:background .15s, color .15s;
  }
  #modalClose:hover{background:var(--line);color:var(--canopy);}

  @media (max-width:640px){
    #dash{padding:18px 16px 50px;}
    .header{align-items:flex-start;}
    .header h1{font-size:24px;}
    th,td{padding:10px 12px;font-size:12.5px;}
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-mark">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M22 3C22 3 9 10 9 23c0 8 6 14 13 18 7-4 13-10 13-18C35 10 22 3 22 3Z" fill="#2D6A4F" stroke="#D9A441" stroke-width="1.4"/>
      <path d="M22 8v29M22 15c-4 0-8 2-9.5 6M22 22c4 0 8.5 1.5 10.5 5.5" stroke="#173D2E" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    <span class="tag">Admin console</span>
  </div>
  <div class="login-card">
    <h1>DEMETER 26'</h1>
    <p class="sub">Sign in to review live results</p>
    <div class="field">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" placeholder="you@school.edu" autocomplete="username">
    </div>
    <div class="field">
      <label for="loginPass">Password</label>
      <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button id="loginBtn">Sign in</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="dash">
  <div class="header">
    <div>
      <div class="eyebrow">Live results</div>
      <h1>DEMETER 26' Dashboard</h1>
      <p class="sub">Every submission updates here in real time.</p>
    </div>
    <button class="btn outline" id="logoutBtn">Sign out</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="statTotal">0</div><div class="label">Submitted</div></div>
    <div class="stat"><div class="num" id="statInProgress">0</div><div class="label">In progress</div></div>
    <div class="stat"><div class="num" id="statAvg">0</div><div class="label">Avg score</div></div>
    <div class="stat"><div class="num" id="statAuto">0</div><div class="label">Auto-submitted</div></div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="Search name or school…">
    <select id="sortSelect">
      <option value="score-desc">Score (high→low)</option>
      <option value="score-asc">Score (low→high)</option>
      <option value="time-desc">Newest first</option>
      <option value="violations-desc">Most violations</option>
    </select>
    <button class="btn" id="exportBtn">Export CSV</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Name</th><th>School</th><th>Grade</th><th>Score /120</th><th>Fast</th><th>Violations</th><th>Status</th><th>Duration</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<div id="modalBg">
  <div id="modal">
    <button id="modalClose">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC53ALBwvxPueJgFK8pyPW4L-fe7BJypQQ",
  authDomain: "cse-analise.firebaseapp.com",
  databaseURL: "https://cse-analise-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "cse-analise",
  storageBucket: "cse-analise.firebasestorage.app",
  messagingSenderId: "757658375864",
  appId: "1:757658375864:web:a8e237963d9a6933b5864d",
  measurementId: "G-NPCR5HMMV0"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// ---------------------------------------------------------------
// Answer key lives ONLY here (admin.html is never sent to students)
// ---------------------------------------------------------------
const ANSWER_KEY = {
  1:"23rd of March", 2:"197", 3:"Citarum River", 4:"Ionian Sea",
  5:"Using Old Refrigerators", 6:"The Central and the Eastern equatorial Pacific Ocean",
  7:"Minamata Convention - Japan", 8:"Dire Wolf", 9:"The Ceylon Rose",
  10:"Western Ghats", 11:"Amu Darya, Syr Darya and the Jordan River",
  12:"Challenger Deep", 13:"700 years", 14:"Lake Baikal - Russia",
  15:"The salt water crocodile", 16:"Jacobabad", 17:"Yamuna River and Ganga River",
  18:"Panthera pardus sinhaleyus", 19:"Bulathsinhala", 20:"Convection Currents",
  21:"Galapagos Archipelago", 22:"Aldabra Giant Tortoise", 23:"Green Turtle",
  24:"Chernobyl - 1986", 25:"South Korea", 26:"Meghalaya",
  27:"2.7 Million Ha", 28:"South China Tiger", 29:"Paleoloxodon namadicus",
  30:"Sumatran Elephant", 31:"Muthurajawela", 32:"1981",
  33:"Bangladesh", 34:"Silavathurai", 35:"Namami Gange",
  36:"Colombo", 37:"Sundarbans", 38:"King Dutugemunu",
  39:"Mullaitivu and Trincomalee", 40:"Victoria", 41:"Sulaiman and Indus",
  42:"Gal Oya", 43:"Adenosine Tri Pospate", 44:"Water Spinach and Ceylon Toque Macaque",
  45:"East Africa",
  // Q46: marker on the map sits ~20km from Kanneliya vs ~38km from Sinharaja
  // (measured from the marker's position relative to the coastline) — worth a
  // quick visual double-check against your source map before go-live.
  // Q47: photo shows a terrestrial weed with clustered white flower heads —
  // not aquatic (rules out Water Hyacinth) and not the pink/purple star
  // flowers of Philippine Firework, so Parthenium is the match.
  46:"Kanneliya - Low Country Tropical Rainforest",
  47:"Pathenium",
  48:"Fukushima - Japan",
  49:"Bar Reef - Kalpitiya Peninsula",
  50:"From east to west, piling up warm surface water in the western Pacific near Indonesia and Australia."
};
const QUESTION_TEXT = {
  1:"When is the World Meteorology Day?", 2:"How many countries signed the Montreal Protocol?",
  3:"The most polluted river (main water resource of Jakarta)", 4:"Sea connecting the Adriatic Sea to the Mediterranean Sea",
  5:"A way CFC is released to the atmosphere", 6:"Where El-Nino happens",
  7:"Convention to protect against mercury releases, and where signed", 8:"Pre-historic animal revived by scientists",
  9:"National butterfly of Sri Lanka", 10:"Biodiversity hotspot in India",
  11:"Main water sources of the Aral Sea and Dead Sea", 12:"Deepest point in the Mariana Trench",
  13:"Years to dissolve a toothbrush", 14:"Largest freshwater lake in Asia & country",
  15:"Largest type of crocodile", 16:"Hottest city in Asia",
  17:"Pair of rivers starting from glaciers", 18:"Scientific name of the Sri Lankan Leopard",
  19:"Location of Walawwatta Wagurana marsh forest", 20:"Reason for tectonic plate movement",
  21:"Island that helped Darwin's evolution studies", 22:"Tortoise with longest life expectancy",
  23:"Turtle visiting Sri Lankan coast most for laying eggs", 24:"Most devastated nuclear plant explosion & year",
  25:"Country evaluated by UNEP for forest fire suppression", 26:"Administrative state with highest rainfall",
  27:"Hectares of forest cover in Sri Lanka", 28:"Tiger sub-species with ~30 left",
  29:"Closest ancient relative to the Sri Lankan Elephant", 30:"Critically endangered Asian elephant sub-species",
  31:"Largest wetland in Sri Lanka", 32:"Year Central Environmental Authority established",
  33:"Most polluted country (Air Pollution Index)", 34:"Sea shore in Sri Lanka known for pearls",
  35:"India's river-saving project", 36:"City known as 'Ramsar Wetland City'",
  37:"Largest marshland in the world", 38:"King who implemented the 'Maghatha Law'",
  39:"Districts of Bay of Koddiyar and Nandikadal Lagoon", 40:"Largest hydro-power plant in Sri Lanka",
  41:"Mountain range and river in Pakistan", 42:"First farming colony in Sri Lanka",
  43:"ATP expansion / anaerobic respiration result", 44:"Ipomea aquatica and Macaca sinica",
  45:"Region with high rainfall due to El-Nino",
  46:"Forest shown on the map & its type", 47:"Invasive flora in the picture",
  48:"2011 nuclear plant explosion — plant & location", 49:"Largest coral reef in Sri Lanka",
  50:"Trade wind direction & effect on sea surface temperature (normal conditions)"
};
const TOTAL_Q = Object.keys(ANSWER_KEY).length;

// Marking scheme:
//  Q1-15  = 1 mark each   (15)
//  Q16-35 = 2 marks each  (40)
//  Q36-50 = 4 marks each  (60)
//  = 115 raw marks, + 5 bonus marks for students who answered
//    more than 25 of the 50 questions within the first 10s of the
//    20s answering window ("fast" answers) = 120 max.
const FAST_BONUS_THRESHOLD = 25;
const FAST_BONUS_MARKS = 5;
function marksForQuestion(id){
  if(id<=15) return 1;
  if(id<=35) return 2;
  return 4;
}

// ---------------- Auth ----------------
document.getElementById('loginBtn').addEventListener('click', ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginError').textContent='';
  auth.signInWithEmailAndPassword(email, pass).catch(err=>{
    document.getElementById('loginError').textContent = 'Sign-in failed: '+err.message;
  });
});
document.getElementById('logoutBtn').addEventListener('click', ()=> auth.signOut());

let allSubmissions = {};

auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('dash').style.display='block';
    listenSubmissions();
  } else {
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('dash').style.display='none';
  }
});

function scoreSubmission(sub){
  let rawScore=0;
  let fastCount=0;
  const details=[];
  for(let i=1;i<=TOTAL_Q;i++){
    const a = sub.answers ? sub.answers[i] : undefined;
    // support both the new {value,fast} shape and legacy plain-string answers
    const given = a && typeof a==='object' ? a.value : a;
    const fast = !!(a && typeof a==='object' && a.fast);
    const correct = ANSWER_KEY[i];
    const marks = marksForQuestion(i);
    const isCorrect = given!==undefined && given===correct;
    if(isCorrect) rawScore += marks;
    if(fast) fastCount++;
    details.push({id:i, qtext:QUESTION_TEXT[i], given, correct, isCorrect, marks, fast});
  }
  const bonus = fastCount > FAST_BONUS_THRESHOLD ? FAST_BONUS_MARKS : 0;
  return { rawScore, bonus, score: rawScore+bonus, fastCount, details, maxRaw:115, maxTotal:120 };
}

function listenSubmissions(){
  db.ref('submissions').on('value', snap=>{
    allSubmissions = snap.val() || {};
    renderTable();
  });
}

function renderTable(){
  const search = document.getElementById('searchBox').value.toLowerCase();
  const sort = document.getElementById('sortSelect').value;
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML='';

  let rows = Object.entries(allSubmissions).map(([key,sub])=>{
    const {score} = scoreSubmission(sub);
    const duration = sub.endTime && sub.startTime ? Math.round((sub.endTime-sub.startTime)/1000) : null;
    return {key, sub, score, duration};
  });

  if(search){
    rows = rows.filter(r=>
      (r.sub.name||'').toLowerCase().includes(search) ||
      (r.sub.school||'').toLowerCase().includes(search)
    );
  }

  rows.sort((a,b)=>{
    if(sort==='score-desc') return b.score-a.score;
    if(sort==='score-asc') return a.score-b.score;
    if(sort==='violations-desc') return (b.sub.violationCount||0)-(a.sub.violationCount||0);
    if(sort==='time-desc') return (b.sub.startTime||0)-(a.sub.startTime||0);
    return 0;
  });

  let submittedCount=0, inProgress=0, autoCount=0, scoreSum=0;
  Object.values(allSubmissions).forEach(sub=>{
    if(sub.status==='submitted'){
      submittedCount++;
      scoreSum += scoreSubmission(sub).score;
      if(sub.autoSubmitted) autoCount++;
    } else inProgress++;
  });
  document.getElementById('statTotal').textContent = submittedCount;
  document.getElementById('statInProgress').textContent = inProgress;
  document.getElementById('statAvg').textContent = submittedCount ? (scoreSum/submittedCount).toFixed(1) : '0';
  document.getElementById('statAuto').textContent = autoCount;

  if(rows.length===0){
    const tr = document.createElement('tr');
    tr.className = 'empty-row';
    tr.innerHTML = `<td colspan="8">${Object.keys(allSubmissions).length ? 'No results match your search.' : 'No submissions yet — results will appear here as students finish the quiz.'}</td>`;
    tbody.appendChild(tr);
    return;
  }

  rows.forEach(({key,sub,score,duration})=>{
    const tr = document.createElement('tr');
    const violBadgeClass = (sub.violationCount||0)===0 ? 'ok' : (sub.violationCount>=3?'warn':'mid');
    const statusBadge = sub.status==='submitted'
      ? (sub.autoSubmitted ? '<span class="badge warn">Auto-submitted</span>' : '<span class="badge ok">Submitted</span>')
      : '<span class="badge mid">In progress</span>';
    const {fastCount, bonus} = scoreSubmission(sub);
    tr.innerHTML = `
      <td>${escapeHtml(sub.name||'—')}</td>
      <td>${escapeHtml(sub.school||'—')}</td>
      <td>${escapeHtml(sub.grade||'—')}</td>
      <td><b>${score}</b> / 120${bonus?' <span class="badge ok">+'+bonus+'</span>':''}</td>
      <td>${fastCount}/${TOTAL_Q}</td>
      <td><span class="badge ${violBadgeClass}">${sub.violationCount||0}</span></td>
      <td>${statusBadge}</td>
      <td>${duration!==null ? duration+'s' : '—'}</td>
    `;
    tr.addEventListener('click', ()=>openModal(key));
    tbody.appendChild(tr);
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('searchBox').addEventListener('input', renderTable);
document.getElementById('sortSelect').addEventListener('change', renderTable);

// ---------------- Modal ----------------
function openModal(key){
  const sub = allSubmissions[key];
  const {score, rawScore, bonus, fastCount, details} = scoreSubmission(sub);
  const violations = sub.violations ? Object.values(sub.violations) : [];

  let html = `<h2>${escapeHtml(sub.name)} — ${score}/120</h2>
    <p style="color:var(--fern);margin-top:-8px;">${escapeHtml(sub.school)} · ${escapeHtml(sub.grade)}</p>
    <p style="font-size:13px;color:var(--bark);">Raw: ${rawScore}/115 &nbsp;·&nbsp; Fast answers: ${fastCount}/${TOTAL_Q} (need >${FAST_BONUS_THRESHOLD} for bonus) &nbsp;·&nbsp; Bonus: ${bonus? '+'+bonus : '0'}</p>`;

  if(violations.length){
    html += `<h3 style="font-size:15px;">Violations (${violations.length})</h3>`;
    violations.forEach(v=>{
      html += `<div class="viol-item">${v.type} — ${new Date(v.time).toLocaleTimeString()}</div>`;
    });
  }

  html += `<div style="margin-top:10px;">
    <button class="btn alert" onclick="resetDevice('${sub.deviceId}','${sub.fingerprint||''}')">Allow this device to retake</button>
  </div>`;

  html += `<h3 style="font-size:15px;margin-top:18px;">Answers</h3>`;
  details.forEach(d=>{
    const cls = d.given===undefined ? 'unanswered' : (d.isCorrect ? 'correct' : 'wrong');
    const givenText = d.given===undefined ? 'No answer' : d.given;
    html += `<div class="qa-row">
      <div class="qtxt">${d.id}. ${escapeHtml(d.qtext)} <span style="color:var(--fern);font-weight:400;">(${d.marks} mark${d.marks>1?'s':''}${d.fast?' · fast':''})</span></div>
      <div class="ans ${cls}">Given: ${escapeHtml(givenText)}</div>
      ${!d.isCorrect ? `<div class="ans" style="color:#555;">Correct: ${escapeHtml(d.correct)}</div>` : ''}
    </div>`;
  });

  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalBg').style.display='flex';
}
document.getElementById('modalClose').addEventListener('click', ()=>{
  document.getElementById('modalBg').style.display='none';
});
document.getElementById('modalBg').addEventListener('click', e=>{
  if(e.target.id==='modalBg') document.getElementById('modalBg').style.display='none';
});

window.resetDevice = function(deviceId, fingerprint){
  if(!confirm('Allow this device to take the quiz again? This removes the device lock only — the previous submission stays on record.')) return;
  db.ref('devices/'+deviceId).remove();
  if(fingerprint) db.ref('deviceFingerprints/'+fingerprint).remove();
  alert('Device unlocked. The student must also clear browser storage or use a different browser tab profile, since the local device flag persists in their browser only.');
};

// ---------------- CSV export ----------------
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const rows = [['Name','School','Grade','Score /120','Raw /115','Bonus','Fast Answers','Violations','Status','Auto-Submitted','Start Time','End Time']];
  Object.values(allSubmissions).forEach(sub=>{
    const {score, rawScore, bonus, fastCount} = scoreSubmission(sub);
    rows.push([
      sub.name, sub.school, sub.grade, score, rawScore, bonus, fastCount+'/'+TOTAL_Q, sub.violationCount||0,
      sub.status, sub.autoSubmitted?'Yes':'No',
      sub.startTime?new Date(sub.startTime).toISOString():'',
      sub.endTime?new Date(sub.endTime).toISOString():''
    ]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='demeter26_results.csv';
  a.click();
  URL.revokeObjectURL(url);
});
</script>
